services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-kronocash
    environment:
      POSTGRES_DB: db_bc8adb67a77b
      POSTGRES_USER: kronoadmin
      POSTGRES_PASSWORD: R3rTxLziw94A
    #   - "5877:5432" // descomentar sol,amente si ocupamos exponer la base de datos para usar algún lector
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kronocash-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronoadmin -d db_bc8adb67a77b"]
      interval: 5s
      timeout: 5s
      retries: 5

  kronocash-app:
    build: .
    container_name: app-kronocash
    ports:
      - "2309:2309"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/db_bc8adb67a77b
      - SPRING_DATASOURCE_USERNAME=kronoadmin
      - SPRING_DATASOURCE_PASSWORD=R3rTxLziw94A
      - SPRING_FLYWAY_ENABLED=true
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - kronocash-net

volumes:
  pgdata:

networks:
  kronocash-net:
    driver: bridge